id = "clef-flash"
order = 90
display_name = "clef-flash"
endpoint = "http://127.0.0.1:18009/v1/systemone"
profiles = ["full", "extended"]
runtime_model = "clef-flash"
note = "mlx-community/clef-flash-4bit pinned INT4 backbone, BF16 head; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "clef-flash"]

[launch]
command = ["{work}/envs/d3-clef/bin/python", "-m", "runtime_backends.bridge", "--model", "clef-flash", "--port", "18009"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
