id = "d3-flash"
order = 80
display_name = "d3-flash"
endpoint = "http://127.0.0.1:18008/v1/systemone"
profiles = ["extended"]
runtime_model = "d3-flash"
note = "thoddnn/d3-flash-q4 pinned backbone INT4, vision BF16, readout FP32; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "d3-flash"]

[launch]
command = ["{work}/envs/d3-clef/bin/python", "-m", "runtime_backends.bridge", "--model", "d3-flash", "--port", "18008"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
