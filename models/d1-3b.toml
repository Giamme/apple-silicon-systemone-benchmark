id = "d1-3b"
order = 100
display_name = "d1-3b"
endpoint = "http://127.0.0.1:18010/v1/systemone"
profiles = ["extended"]
runtime_model = "d1-3b"
note = "LiquidAI/d1-3B-MLX-fp16 pinned FP16; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "d1-3b"]

[launch]
command = ["{work}/envs/liquid/bin/python", "-m", "runtime_backends.bridge", "--model", "d1-3b", "--port", "18010"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
