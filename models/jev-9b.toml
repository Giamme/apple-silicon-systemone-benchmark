id = "jev-9b"
order = 120
display_name = "jev-9b"
endpoint = "http://127.0.0.1:18012/v1/systemone"
profiles = ["extended"]
runtime_model = "jev-9b"
note = "nativ-community/JEV-9B-MLX-NVFP4 pinned NVFP4 backbone, BF16 readout, FP32 probability math; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "jev-9b"]

[launch]
command = ["{work}/envs/jev/bin/python", "-m", "runtime_backends.bridge", "--model", "jev-9b", "--port", "18012"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
