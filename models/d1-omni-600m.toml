id = "d1-omni-600m"
order = 110
display_name = "d1-omni-600m"
endpoint = "http://127.0.0.1:18011/v1/systemone"
profiles = ["full", "extended"]
runtime_model = "d1-omni-600m"
note = "LiquidAI/d1-omni-600M-MLX-fp16 pinned FP16; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "d1-omni-600m"]

[launch]
command = ["{work}/envs/liquid/bin/python", "-m", "runtime_backends.bridge", "--model", "d1-omni-600m", "--port", "18011"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
