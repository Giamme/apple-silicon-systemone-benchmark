id = "d3-mini"
order = 70
display_name = "d3-mini"
endpoint = "http://127.0.0.1:18007/v1/systemone"
profiles = ["extended"]
runtime_model = "d3-mini"
note = "ahmedandaloes/d3-mini-mlx pinned BF16; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "d3-mini"]

[launch]
command = ["{work}/envs/d3-clef/bin/python", "-m", "runtime_backends.bridge", "--model", "d3-mini", "--port", "18007"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
