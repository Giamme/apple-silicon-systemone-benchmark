id = "d3-edge"
order = 50
display_name = "d3-edge"
endpoint = "http://127.0.0.1:18005/v1/systemone"
profiles = ["extended"]
runtime_model = "d3-edge"
note = "ahmedandaloes/d3-edge-mlx pinned BF16; native decision readout."

[setup]
command = ["python3", "{root}/scripts/setup_runtime.py", "d3-edge"]

[launch]
command = ["{work}/envs/d3-clef/bin/python", "-m", "runtime_backends.bridge", "--model", "d3-edge", "--port", "18005"]
env = { HF_HUB_OFFLINE = "1", TRANSFORMERS_OFFLINE = "1" }

[version]
command = ["git", "rev-parse", "HEAD"]
